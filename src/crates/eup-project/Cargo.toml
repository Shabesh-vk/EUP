[package]
name = "eup-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The edit itself: the project document, its operations, and undo. The engine's ownership of the model."

[dependencies]
# The speed curve's arithmetic lives with the engine's time map.
eup-core.workspace = true
# `rc`: timelines and clips sit behind Arc so an undo snapshot shares what
# a command did not touch; the document still reads and writes them plain.
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# A JSON Schema for every type a command carries, from the same doc
# comments, for a caller that hands the schema to an agent (eup-mcp).
# Off by default: the engine and the window do not need it.
schema = ["dep:schemars"]

[lints]
workspace = true
