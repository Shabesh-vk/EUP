version: "3.8"

services:
  # MinIO S3-Compatible Local Storage (Integration Standard 7)
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: incubrix-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # IncuBrix Editing Engine API Service (Integration Standards 1, 2, 3)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=incubrix-outputs
      - MAX_VIDEO_DURATION_S=7200.0
      - WEBHOOK_SECRET=incubrix_secret_key_123
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-Command Test Runner Service (Integration Standard 1)
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-tests
    environment:
      - LLM_PROVIDER=mock
    command: ["pytest", "-v", "incubrix_engine/tests/"]
    depends_on:
      - api
