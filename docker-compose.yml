version: '3.8'

services:
  # Primary IncuBrix Editing Engine Service
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-engine
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-videos
      - STT_PROVIDER=mock
      - LLM_PROVIDER=mock
      - DEFAULT_TIME_POLICY=original
    volumes:
      - ./storage_data:/app/storage_data
      - ./test_pack/batch_results:/app/test_pack/batch_results
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: incubrix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Auto-bucket provisioner for MinIO
  minio-init:
    image: minio/mc:RELEASE.2024-03-15T00-14-53Z
    container_name: incubrix-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/incubrix-videos;
      /usr/bin/mc anonymous set public local/incubrix-videos;
      exit 0;
      "

  # Automated Test Runner Container
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-tests
    command: ["pytest", "-v"]
    depends_on:
      - engine
    profiles:
      - test

volumes:
  minio_data:
