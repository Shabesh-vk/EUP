# Conversation: greetings and questions change nothing.
source:
  duration_s: 240
  lines:
    - [5, "Hi everyone."]
    - [42, "Welcome to the channel."]
    - [65, "Our pricing is simple."]
    - [100, "Let me show you the dashboard."]
    - [135, "The pricing changed last year."]
    - [195, "Pricing for teams is different."]
    - [230, "Thanks for watching."]
steps:
  - say: "hi"
    expect:
      status: "applied"
      recorded: false
      code: "TALK"
  - say: "how long is my video now?"
    expect:
      status: "applied"
      summary_contains: "4:00 long"
  - say: "thanks!"
    expect:
      status: "applied"
      recorded: false
