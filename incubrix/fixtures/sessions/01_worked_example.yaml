# The brief's 8-step worked example, typed as words.
source:
  duration_s: 240
  lines:
    - [5, "Hi everyone."]
    - [42, "Welcome to the channel."]
    - [65, "Our pricing is simple."]
    - [100, "Let me show you the dashboard."]
    - [135, "The pricing changed last year."]
    - [195, "Pricing for teams is different."]
    - [230, "Thanks for watching."]
steps:
  - say: "Add a caption 'Welcome!' when I say welcome to the channel"
    expect:
      status: "applied"
      duration_s: 240.0
      recorded: true
  - say: "Cut the first 30 seconds"
    expect:
      status: "applied"
      duration_s: 210.0
      summary_contains: "current edited playback time"
  - say: "Remove the part about pricing"
    answer: "the second one"
    expect:
      asked: true
      options: 4
      question_contains: "mentioned 3 times"
      status: "applied"
      duration_s: 208.0
  - say: "Speed up from 1:00 to 1:30 by 2x"
    expect:
      status: "applied"
      duration_s: 193.0
      summary_contains: "current edited playback time"
  - say: "Actually, put the intro back"
    expect:
      status: "applied"
      duration_s: 223.0
  - say: "Undo"
    expect:
      status: "applied"
      duration_s: 193.0
      recorded: false
      same_timeline_as_step: 4
  - say: "Make that caption red"
    expect:
      status: "applied"
      duration_s: 193.0
      recorded: true
  - say: "render"
    expect:
      status: "applied"
      duration_s: 193.0
      captions: 1
      captions_shown: 1
