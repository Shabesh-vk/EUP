# Background music added and removed.
source:
  duration_s: 240
  lines:
    - [5, "Hi everyone."]
    - [42, "Welcome to the channel."]
    - [65, "Our pricing is simple."]
    - [100, "Let me show you the dashboard."]
    - [135, "The pricing changed last year."]
    - [195, "Pricing for teams is different."]
    - [230, "Thanks for watching."]
steps:
  - say: "add background music 'bed.mp3'"
    expect:
      status: "applied"
      recorded: true
  - say: "remove the music"
    expect:
      status: "applied"
  - say: "remove the music"
    expect:
      status: "rejected"
      code: "NO_MUSIC"
