# A caption hidden by a cut comes back on undo.
source:
  duration_s: 240
  lines:
    - [5, "Hi everyone."]
    - [42, "Welcome to the channel."]
    - [65, "Our pricing is simple."]
    - [100, "Let me show you the dashboard."]
    - [135, "The pricing changed last year."]
    - [195, "Pricing for teams is different."]
    - [230, "Thanks for watching."]
steps:
  - say: "Add a caption 'Welcome!' when I say welcome to the channel"
    expect:
      status: "applied"
  - say: "cut 0:42 to 0:44"
    expect:
      status: "applied"
      warning_contains: "hidden"
  - say: "undo"
    expect:
      status: "applied"
      captions: 1
      captions_shown: 1
